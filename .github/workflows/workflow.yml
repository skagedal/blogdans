{
  name: "CI",
  on:
    {
      push: { branches: ["main"] },
      pull_request: {},
    },
  jobs:
    {
      checks:
        {
          name: "Lint and type-check",
          "runs-on": "ubuntu-latest",
          steps:
            [
              { name: "Check out code", uses: "actions/checkout@v6" },
              {
                name: "Set up pnpm",
                uses: "pnpm/action-setup@v5",
              },
              {
                name: "Set up Node.js",
                uses: "actions/setup-node@v6",
                with: { "node-version": "22", cache: "pnpm" },
              },
              {
                name: "Install dependencies",
                run: "pnpm install --frozen-lockfile",
              },
              { name: "Lint", run: "pnpm lint" },
              { name: "Type check", run: "pnpm tsc --noEmit" },
            ],
        },
      main:
        {
          name: "Build and deploy",
          needs: "checks",
          if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}",
          "runs-on": "ubuntu-latest",
          steps:
            [
              { name: "Check out code", uses: "actions/checkout@v6" },
              {
                name: "Set up Docker Buildx",
                uses: "docker/setup-buildx-action@v3",
              },
              {
                name: "Log in to Docker Hub",
                uses: "docker/login-action@v3",
                with:
                  {
                    username: "${{ secrets.DOCKERHUB_USERNAME }}",
                    password: "${{ secrets.DOCKERHUB_TOKEN }}",
                  },
              },
              {
                name: "Build and push",
                uses: "docker/build-push-action@v5",
                with:
                  {
                    context: ".",
                    file: "main.Dockerfile",
                    push: true,
                    tags: "skagedal/blogdans:latest",
                  },
              },
              { name: "Set up kubectl", uses: "azure/setup-kubectl@v4" },
              {
                name: "Configure kubeconfig",
                env:
                  {
                    KUBECONFIG_BASE64: "${{ secrets.KUBECONFIG_BASE64 }}",
                  },
                run: "./ci/setup-kubeconfig",
              },
              {
                name: "Run database migrations",
                run: "./ci/run-migrations",
              },
              {
                name: "Roll out the new image",
                run: "kubectl -n blogdans rollout restart deploy/blogdans && kubectl -n blogdans rollout status deploy/blogdans --timeout=180s",
              },
              {
                id: "report-success",
                name: "Report success",
                env: { SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}" },
                run: "./ci/report success",
              },
              {
                id: "report-failure",
                name: "Report failure",
                if: "${{ failure() }}",
                env: { SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}" },
                run: "./ci/report failure",
              },
            ],
        },
    },
}
