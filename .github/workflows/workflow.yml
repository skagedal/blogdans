{
  name: "CI",
  on:
    {
      push: { branches: ["main"] },
      pull_request: {},
    },
  jobs:
    {
      checks:
        {
          name: "Lint and type-check",
          "runs-on": "ubuntu-latest",
          steps:
            [
              { name: "Check out code", uses: "actions/checkout@v4" },
              {
                name: "Set up pnpm",
                uses: "pnpm/action-setup@v4",
              },
              {
                name: "Set up Node.js",
                uses: "actions/setup-node@v4",
                with: { "node-version": "22", cache: "pnpm" },
              },
              {
                name: "Install dependencies",
                run: "pnpm install --frozen-lockfile",
              },
              { name: "Lint", run: "pnpm lint" },
              { name: "Type check", run: "pnpm tsc --noEmit" },
            ],
        },
      main:
        {
          name: "Build and deploy",
          needs: "checks",
          if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}",
          "runs-on": "ubuntu-latest",
          steps:
            [
              { name: "Check out code", uses: "actions/checkout@v4" },
              {
                name: "Set up Docker Buildx",
                uses: "docker/setup-buildx-action@v3",
              },
              {
                name: "Log in to Docker Hub",
                uses: "docker/login-action@v3",
                with:
                  {
                    username: "${{ secrets.DOCKERHUB_USERNAME }}",
                    password: "${{ secrets.DOCKERHUB_TOKEN }}",
                  },
              },
              {
                name: "Build and push",
                uses: "docker/build-push-action@v5",
                with:
                  {
                    context: ".",
                    file: "main.Dockerfile",
                    push: true,
                    tags: "skagedal/blogdans:latest",
                  },
              },
              {
                id: "ssh",
                name: "Set up SSH",
                env:
                  {
                    SSH_KEY: "${{ secrets.SSH_KEY }}",
                    SSH_KNOWN_HOSTS: "${{ secrets.SSH_KNOWN_HOSTS }}",
                  },
                run: "./ci/setup-ssh",
              },
              {
                name: "Deploy files to server",
                run: "rsync --archive --verbose --compress --delete ./bin ./db blogdans:",
              },
              {
                name: "Run migrations",
                run: "ssh blogdans ./bin/run-migrations",
              },
              {
                name: "Pull Docker image",
                run: "ssh blogdans ./bin/fetch-latest",
              },
              {
                name: "Stop Docker container, making systemd restart it",
                run: "ssh blogdans ./bin/stop-service",
              },
              {
                id: "report-success",
                name: "Report success",
                env: { SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}" },
                run: "./ci/report success",
              },
              {
                id: "report-failure",
                name: "Report failure",
                if: "${{ failure() }}",
                env: { SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}" },
                run: "./ci/report failure",
              },
            ],
        },
    },
}
