# YAML manifest instead of package.json, so we can write comments like this one.
# We'd prefer package.json5, but pnpm/action-setup (used in our CI workflow) doesn't
# read the packageManager field from package.json5 yet - only package.json/package.yaml.
# See https://github.com/pnpm/action-setup/pull/191 (open, unmerged as of 2026-07-30).
{
  "name": "blogdans",
  "version": "0.1.0",
  "private": true,
  "scripts": {
    "dev": "next dev --turbopack",
    "build": "next build",
    "start": "next start",
    "lint": "eslint .",
    "lint:fix": "eslint . --fix",
    "db": "kysely-codegen --out-file src/db/schema.d.ts",
    "test": "vitest",
    "test:run": "vitest run",
  },
  "dependencies": {
    "@radix-ui/react-avatar": "latest",
    "@radix-ui/react-dropdown-menu": "latest",
    "@radix-ui/react-slot": "latest",
    "@radix-ui/react-toast": "latest",
    "@slack/webhook": "latest",
    "@tanstack/react-query": "latest",
    "@trpc/client": "latest",
    "@trpc/next": "latest",
    "@trpc/server": "latest",
    "@trpc/tanstack-react-query": "latest",
    "better-auth": "latest",
    "class-variance-authority": "latest",
    "clsx": "latest",
    "date-fns": "latest",
    "gray-matter": "latest",
    "kysely": "latest",
    "lucide-react": "latest",
    "next": "latest",
    "nodemailer": "latest",
    "pg": "latest",
    "react": "latest",
    "react-dom": "latest",
    "react-icons": "latest",
    "react-markdown": "latest",
    "rehype-highlight": "latest",
    "rehype-raw": "latest",
    "rehype-sanitize": "latest",
    "rehype-stringify": "latest",
    "remark-gfm": "latest",
    "remark-parse": "latest",
    "remark-rehype": "latest",
    "superjson": "latest",
    "tailwind-merge": "latest",
    "unified": "latest",
    "winston": "latest",
    "zod": "latest",
  },
  "devDependencies": {
    "@tailwindcss/postcss": "latest",
    "@tailwindcss/typography": "latest",
    "@testcontainers/postgresql": "latest",
    "@types/node": "latest",
    "@types/nodemailer": "latest",
    "@types/pg": "latest",
    "@types/react": "latest",
    "@types/react-dom": "latest",
    "@typescript/native": "npm:typescript@^7",
    "@vitest/browser": "latest",
    "@vitest/browser-playwright": "latest",
    "@vitest/ui": "latest",
    "dbmate": "latest",
    # Pinned below 10.x: eslint-plugin-react (pulled in via eslint-config-next) crashes on
    # ESLint 10 with "contextOrFilename.getFilename is not a function". Tracked at
    # https://github.com/jsx-eslint/eslint-plugin-react/issues/3977 (open as of 2026-07-30).
    "eslint": "^9",
    "eslint-config-next": "latest",
    "kysely-codegen": "latest",
    "playwright": "latest",
    "postcss": "latest",
    "tailwindcss": "latest",
    "testcontainers": "latest",
    # typescript-eslint doesn't support real TS 7 yet (github.com/typescript-eslint/typescript-eslint/issues/10940),
    # since TS 7.0 ships without a stable programmatic API. So "typescript" resolves to the
    # 6.0 API compat shim for tooling, while @typescript/native provides the real, fast TS 7
    # compiler as the `tsc` binary.
    "typescript": "npm:@typescript/typescript6@^6",
    "uuid": "latest",
    "vitest": "latest",
    "vitest-browser-react": "latest",
  },
  "packageManager": "pnpm@10.34.5+sha512.a4ee05f2f73658255bd6a89859c065a45c28a57daefae2c893a168ee2b73168c37b91e83e57ea67654ad03f03031746430e8bce38e362e042605fb8abc80192e",
}
