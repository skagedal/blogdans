allowBuilds:
  cpu-features: true
  protobufjs: true
  ssh2: true

minimumReleaseAge: 7200

# Security fixes the parents don't pick up on their own; drop each once they do.
overrides:
  # asciinema-player > solid-js@1.9.15 wants seroval ~1.5 (Dependabot #4, #5).
  seroval: ^1.6.3
  seroval-plugins: ^1.6.3
  # glob@10 (via testcontainers) and eslint pin minimatch < 11.0.1 (Dependabot #14).
  minimatch@>=7 <11.0.1: ^11.0.1
